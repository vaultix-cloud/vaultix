[package]
name = "vaultixd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vaultixd"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
subtle = "2"
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
vx-audit = { path = "../vx-audit" }
vx-gate = { path = "../vx-gate" }
vx-jobs = { path = "../vx-jobs" }
vx-keys = { path = "../vx-keys" }
vx-secret = { path = "../vx-secret" }
vx-store = { path = "../vx-store" }

[dev-dependencies]
vx-store = { path = "../vx-store", features = ["testing"] }

[lints]
workspace = true
