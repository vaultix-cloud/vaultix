[workspace]
resolver = "2"
members = ["foundation/*", "domains/*/core", "server", "clients/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Undecided"
publish = false

[workspace.dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
croner = "2"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

# The value path is the only place a secret may be exposed. Every other crate is linted against it.
[workspace.lints.clippy]
disallowed_methods = "deny"
unwrap_used = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
